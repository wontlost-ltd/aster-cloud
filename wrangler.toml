# Cloudflare Workers 配置
# 用于 aster-cloud Next.js 应用（通过 OpenNext 适配）

name = "aster-cloud"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# 主入口点（自定义 worker wrapper，包装 OpenNext 生成的 handler）
# 用于处理根路径重定向，解决 Next.js 15 middleware 不被编译的问题
main = "worker.js"

# 资源目录
assets = { directory = ".open-next/assets", binding = "ASSETS" }

# Smart Placement - 将 Worker 放置在墨尔本区域
# policy.aster-lang.dev 和 PostgreSQL 数据库都部署在墨尔本 OCI
# 使用 GCP australia-southeast2 (墨尔本) 区域配置，将 Worker 放置在最靠近后端的位置
# 参考: https://developers.cloudflare.com/workers/configuration/smart-placement/
[placement]
region = "gcp:australia-southeast2"

# CPU 时间限制（毫秒）
# 默认限制较低（~10-50ms），策略执行需要更多 CPU 时间用于：
# 1. SQL 查询解析和结果处理
# 2. JSON 序列化/反序列化
# 3. 外部 API 响应处理
# 设置为 5000ms (5秒) 以确保复杂策略执行有足够时间
# 最大可设置为 300000ms (5分钟)
# 参考: https://developers.cloudflare.com/changelog/2025-03-25-higher-cpu-limits/
[limits]
cpu_ms = 5000

# KV 缓存 - 用于缓存策略内容、会话数据等
# 减少数据库查询，提升响应速度
[[kv_namespaces]]
binding = "CACHE"
id = "250b39f14c014a5e8e636799c23bb120"

# Hyperdrive 绑定 - PostgreSQL 连接池
#
# localConnectionString is REQUIRED by the OpenNext deploy preflight
# even when deploying to production. The preflight calls
# wrangler's getPlatformProxy() which insists every Hyperdrive binding
# has a local-dev fallback connection string — without it the deploy
# aborts with "no local hyperdrive connection string".
#
# The value is a placeholder. It's only consumed by `wrangler dev`
# (which we don't run from the deploy pipeline) and never reached at
# runtime in production — prod traffic resolves the binding through
# the `id` above to the real Hyperdrive instance.
#
# ⚠️ Local dev: this placeholder does NOT point at a real database.
# If you run `wrangler dev` or `pnpm preview` and want the dashboard to
# read/write data, override the value with a Postgres URL that resolves
# on your machine (Supabase pooler, local docker-compose, etc.) — or
# use `next dev`, which goes through DATABASE_URL instead of this binding.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "b712d2c83ffe41f0b4d0ec615314a935"
localConnectionString = "postgres://placeholder:placeholder@localhost:5432/aster_cloud_dev"

# Cron triggers
# 这些表达式由 worker.js 的 scheduled() 处理函数派发到对应路由，详见
# src/lib/cron-registry.ts。同一窗口的并发触发（Workers + 外部 curl）
# 由 Postgres CronJobLease 表自动去重。
#
# - 04:30 UTC: /api/cron/user-purge (软删 30d 后 hard-delete)
# - 05:00 UTC: /api/cron/risk-tier-decay (≥7d 无风险事件 → tier -1)
# - 每 6 小时: /api/cron/license-revocation-refresh
#   仅 on-prem build 有意义；SaaS 部署中该 route 返回 404。
#   6h 比 plan 默认 24h 更保守，缩短 revocation 触达时间，
#   缓解 OSS Vault 缺 control_group 时的 Witness 旁路风险（PR-L0 codex 审查）。
# - 每周一 08:00 UTC: /api/cron/license-renewal-warning（on-prem 续费提醒）
# - 03:15 UTC: /api/cron/telemetry-retention-gc（J1 — 删除超 365d 的 LicenseTelemetry 行 + 90d/7y 审计窗口）
# - 03:45 UTC: /api/cron/domain-vocabulary-retention（B13 — 90 天降级用户词汇归档）
# - 04:00 UTC: /api/cron/execution-retention-gc（#396 — 按 plan 清执行日志 + 180d 清决策骨架）
# - 04:15 UTC: /api/cron/two-factor-code-gc（#400 — 回收码已过期且限次窗口也已过期的 2FA 行）
[triggers]
crons = ["30 4 * * *", "0 5 * * *", "0 */6 * * *", "0 8 * * 1", "15 3 * * *", "45 3 * * *", "0 4 * * *", "15 4 * * *"]

# 环境变量（公开的，非敏感信息）
[vars]
NODE_ENV = "production"
NEXT_PUBLIC_APP_URL = "https://aster-lang.cloud"
AUTH_TRUST_HOST = "true"
# ★发信域名必须是 Resend 里**已验证**的域（当前已验证：wontlost.com）。
#   代码里的兜底值是 noreply@aster-lang.cloud，而该域**未在 Resend 验证**，
#   一旦落到兜底就会被 Resend 拒收 → 用户看到「无法发送验证码」。
#
# ★必须写在这里（vars），不能只在 dashboard 上加：
#   wrangler.toml 是 vars 的单一真相源，每次部署都会用它**整体覆盖**。
#   实测：dashboard 上加的 RESEND_FROM_EMAIL 在随后两次部署后消失，
#   于是发信静默退回未验证域——这正是本次故障的根因之一。
# 取你在 dashboard 上设过、且**已实测投递成功**的那个地址；
# 不擅自改成 noreply@ —— 该地址未经投递验证，换了可能再次被拒。
RESEND_FROM_EMAIL = "ryan.pang@wontlost.com"

# 敏感环境变量需要通过 wrangler secret 设置：
#
# 必须配置（认证相关）：
# wrangler secret put NEXTAUTH_SECRET    # NextAuth JWT 签名密钥，可用 `openssl rand -base64 32` 生成
# wrangler secret put NEXTAUTH_URL       # 设置为 https://aster-lang.cloud
#
# OAuth 提供者（至少配置一个）：
# wrangler secret put GITHUB_CLIENT_ID
# wrangler secret put GITHUB_CLIENT_SECRET
# wrangler secret put GOOGLE_CLIENT_ID
# wrangler secret put GOOGLE_CLIENT_SECRET
#
# 支付（可选）：
# wrangler secret put STRIPE_SECRET_KEY
# wrangler secret put STRIPE_WEBHOOK_SECRET
#
# 邮件（可选）：
# wrangler secret put RESEND_API_KEY
#
# Aster API 内部调用（policy evaluate-source 必需）：
# wrangler secret put ASTER_PLAN_GATE_HMAC_KEY  # 与 aster-api Vault apps/aster-api-plan-gate.hmac-key 同值
# wrangler secret put ASTER_RUNNER_LAUNCHER_HMAC_KEY  # runner-launcher 独立 HMAC key（密钥隔离，非 plan-gate key；launcher 是新 TCB 成员）
# wrangler secret put ASTER_RUNNER_LAUNCHER_URL       # runner-launcher endpoint（Slice-2a stub/local，Slice-2b 真 launcher）
#
# Aster API URL（可选，默认 https://policy.aster-lang.dev）：
# 编辑器 / AI 客户端会读 NEXT_PUBLIC_ASTER_POLICY_API_URL 作为运行时 baseUrl
# wrangler secret put NEXT_PUBLIC_ASTER_POLICY_API_URL
#
# Cron 鉴权（worker.js scheduled() 派发 + 外部 curl 调用都用）：
# wrangler secret put CRON_SECRET  # `openssl rand -hex 24`
#
# 遥测信封加密 KEK（J3 — AES-256，hex 64 字符或 base64 32 字节）：
# wrangler secret put ASTER_TELEMETRY_SECRET_KEK
# wrangler secret put ASTER_TELEMETRY_SECRET_KEK_KID  # 例 "kek-2026-05"
#
# 遥测数据驻留区域（J2 — 标记 LicenseTelemetry.data_region；默认 'unknown'）：
# wrangler secret put ASTER_DATA_REGION  # us | eu | apac
#
# 遥测客户字段脱敏（J2 — 默认明文；启用后 SaaS 仅保存 anon-<hex>-<len>）：
# wrangler secret put ASTER_TELEMETRY_MASK_CUSTOMER  # "1" to enable
#
# 遥测保留天数（J1 — 默认 365）：
# wrangler secret put TELEMETRY_RETENTION_DAYS
