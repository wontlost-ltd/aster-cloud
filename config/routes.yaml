  # ===== Incoming aliases (URLs the wider world / docs might use) =====
  # Per the recent /playground 404 incident: documents and bookmarks
  # in the wild still reference /playground. We do not own that path,
  # but we explicitly record it as a redirect contract so link
  # checkers (Phase 3) treat external references to /playground as
  # invalid and require callers to use the canonical /policies/new
  # URL with the appropriate ?template=<id>.
  - path: /playground
    status: redirect-to
    canonicalUrl: https://aster-lang.cloud/policies/new
    redirectCode: 308
    owner: app
    locales: all
    notes: |
      Historical name. Not a real route — the editor at /policies/new
      doubles as the Playground. Phase 3 link-checker will reject any
      authored link to /playground and require the canonical target.

