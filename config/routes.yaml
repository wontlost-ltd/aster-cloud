# Route ownership manifest — aster-cloud (aster-lang.cloud).
#
# THIS FILE IS THE SOURCE OF TRUTH for which public URLs aster-cloud
# owns, mirrors, or merely redirects from. The companion file in
# aster-lang-dev (`aster-lang-dev/config/routes.yaml`) is its sibling
# for aster-lang.dev. Together they prevent the class of bug that
# produced the `/playground` 404s and `/zh/zh/policies` double-prefix
# regressions (see ADR 0014).
#
# Status values:
#   canonical-here  — this site owns and serves the route
#   mirror          — this site renders a copy; canonical lives elsewhere
#   redirect-to     — this site only redirects to a canonical URL elsewhere
#
# Locales:
#   `all`      — served at /, /zh/, /de/ (en bare per localePrefix:'as-needed')
#   `en-only`  — only English (e.g. legal pages with no translation)
#   `none`     — no locale segment (e.g. /api/*)
#   ['zh','en','de'] — explicit list when partial
#
# This is the Phase 1 bootstrap. Phase 2 will add a generator that
# verifies every `src/app/[locale]/**/page.tsx` appears here, and
# Phase 3 will wire a link-checker into CI.

version: 1
site: cloud
baseUrl: https://aster-lang.cloud
locales:
  default: en
  prefixed: [zh, de]
generatedAt: null

# Manifest is intentionally curated, not auto-generated. Phase 2 will
# verify completeness; for now this lists the highest-traffic routes
# and every route the dual-site link contract needs to know about.
