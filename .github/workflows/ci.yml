name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一 ref 上新 push 到来时取消尚在跑的过时 CI（PR 连续 push 常见）——省算力/排队。
# ★cancel-in-progress 只对 PR 生效（Codex 审 High）：main push 的 build-migrate-image job
# 有副作用（推 migrate 镜像 + 触发 ArgoCD sync），若被后续 push 取消会导致迁移镜像丢失 /
# app-migration 不一致窗口。故 main 上的 run 必须跑完，绝不取消。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 最小权限：CI 的多数 job 只 checkout+build+test，仅需只读 GITHUB_TOKEN。
# 顶层默认收紧为 contents: read，覆盖 build / e2e / on-prem-build / image-pin-pr
# 四个 job（后者的跨 org 写操作用的是自铸的 image-pin App token，非 GITHUB_TOKEN）。
# 需要额外权限的 build-migrate-image 用 job 级 permissions 覆盖本默认（加 id-token: write）。
permissions:
  contents: read

jobs:
  # ── 探测本地 self-hosted runner 是否可用（省托管额度）─────────────────────
  # ★不采用 aster-api 的 build-local/build-hosted 双 job 拆分：本仓的 `build` 与
  #   `on-prem-build` 既是**分支保护的 required check**，又是 `e2e` /
  #   `build-migrate-image` 的 `needs:` 目标。改名会同时打断这两处，
  #   而 skipped 的 job 会被 required check 当成"未完成"卡住合并。
  #   故改为**保持 job 名不变、只让 runs-on 动态取值**——收益相同，爆炸半径小得多。
  #
  # ★已知取舍（与 aster-api 的差异）：本设计**没有 hosted 兜底**。
  #   aster-api 用 build-local/build-hosted 双 job + `always() && result != 'success'`
  #   能在本地 job 真的失败时自动重跑到托管；本仓为保住 required check 名而用单 job，
  #   代价是「探测通过后 runner 中途崩溃（VM OOM / 磁盘满 / 断网）」会直接让 build 变红。
  #   缓解：pick-runner 已排除 offline/busy 的 runner，覆盖绝大多数情况；
  #   真遇到中途崩溃时**重跑一次**即可（届时探测会判本地不可用 → 自动走 hosted）。
  #   若这类中断变得频繁，再考虑按 aster-api 的方式拆 job 并同步更新分支保护的
  #   required check 名（那是个需要一并改 branch protection 的动作，不能只改 workflow）。
  pick-runner:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.pick.outputs.target }}
      labels: ${{ steps.pick.outputs.target == 'local' && '["self-hosted","linux","ARM64","local-node"]' || '["ubuntu-latest"]' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: pick
        uses: ./.github/actions/pick-runner
        with:
          # ★用 local-node 而非 local-linux：本机跑两个 runner，它们共享 podman VM
          #   的网络命名空间（network=host 是 services: 可达的前提）。若两个 runner
          #   都能接 aster-api 的 job，两个 postgres service 会同时抢 5432 →
          #   `cannot bind tcp port :5432: address already in use`（实测踩过）。
          #   故按用途隔离标签：
          #     local-linux → pang-linux-podman    专供 aster-api（有 services:）
          #     local-node  → pang-linux-podman-2  专供本仓（零 services:，纯 Node/pnpm）
          #   代价：两个 runner 不再互为备份；本仓 runner 忙时直接回落 hosted。
          labels: self-hosted,linux,ARM64,local-node
          # 只读 runner 状态的最小权限 token。未配置/无权限/API 出错时一律保守
          # 回落 hosted——探测器绝不能成为 CI 的故障点。
          token: ${{ secrets.RUNNER_PROBE_TOKEN }}

  build:
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.labels) }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # ADR-0009 消费侧 artifact 合同：扫**实际安装的** @aster-cloud/aster-lang-ts npm 包——
      #   (1) browser entry 闭包无 node:*/bare Node builtin（edge bundle 安全）
      #   (2) PII 跨运行时守卫符号+call-site 在场 + typecheck-pii.js 走纯 leaf alias（防降级到无守卫旧版）
      # 信任边界异于 lang-ts CI 的 pre-pack 扫描（验「装进 node_modules 的包」非「发布源构建」）。
      # vendor tarball（npm 发布凭证缺失期的 file:vendor 应急方案）已于 npm 1.0.6 退役——
      # 原「Vendor tarball SLA enforcement」step 的 PII 内容契约已合并进本 verifier。
      - name: Verify installed aster-lang-ts browser artifact (edge-safe + ADR-0009 PII)
        run: node scripts/verify-aster-lang-browser-artifact.mjs

      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      # #98: the standalone LSP image must pin the same compiler version as the
      # app, else the deployed language server runs a stale compiler.
      - name: LSP compiler pin matches app
        run: pnpm run check:lsp-pin
      # #98: .env.production is bundled to the client — only NEXT_PUBLIC_* allowed.
      - name: .env.production has only NEXT_PUBLIC_* keys
        run: pnpm run check:env-production
      - name: Verify message catalog parity (en backbone)
        run: pnpm run check:locales:strict
      # ★上一步比的是**语言之间**（zh/de/hi 跟不跟得上 en），对「一个键所有语言
      # 都没有」完全隐形——那种键在 en 骨架里也不存在，不会被当成缺口。
      # 本步比的是**代码 vs 文案**：每个 t('key') 在真相源里是否真有对应叶子。
      # 缺 key 不崩页（intl-client-provider 兜底成显示 key 路径），故只能主动查。
      # 存量缺失入基线不阻塞；新增缺键 exit 1。
      - name: Verify t() keys exist in message source
        run: pnpm run check:message-keys
      # #98: report partial-locale coverage (hi shipped ~7%). Non-blocking —
      # the threshold is a product decision; deep-merge fallback prevents crashes.
      - name: Locale coverage report (non-blocking)
        run: pnpm run check:locale-coverage
        continue-on-error: true
      # Route ownership contract (ADR 0014). Two checks:
      #   1. routes:build must be a no-op — the committed
      #      public/.well-known/routes.json must match what the
      #      generator produces from config/routes.yaml.
      #   2. routes:check verifies every src/app/[locale]/page.tsx
      #      and every src/app/api/route.ts has a manifest entry, and
      #      every manifest entry with `source:` resolves to a real file.
      # Phase 3 will add cross-site link validation against
      # aster-lang-dev's manifest snapshot.
      - name: Route ownership — generated JSON is up to date
        run: |
          pnpm run routes:build
          git diff --exit-code public/.well-known/routes.json
      - name: Route ownership — coverage
        run: pnpm run routes:check
      # Every docs MDX page must carry a non-empty frontmatter `description:`
      # so generateMetadata emits a real <meta name="description"> (SEO +
      # social-share cards). A live Lighthouse audit found all 25 routes
      # (75 localized MDX files: 25 × en/zh/de) shipping blank meta
      # descriptions. `--check` parses the YAML frontmatter and fails if any
      # file is missing or has an empty/whitespace description; run
      # `pnpm docs:descriptions` to backfill from the page's first prose
      # paragraph.
      - name: Docs — every page has a meta description
        run: pnpm run check:docs-descriptions
      # The committed Cmd+K search index (src/lib/docs/search-index.*.json) is
      # generated from the docs MDX by build-docs-index.mjs. --check rebuilds
      # in memory and compares against the committed files WITHOUT writing
      # (side-effect-free), failing if they drift — a docs edit (e.g. a
      # changed description/heading) that forgets to commit the rebuilt index
      # would otherwise serve a stale index at runtime. Run
      # `pnpm docs:index:build` and commit the result to fix.
      - name: Docs — search index is up to date
        run: pnpm run check:docs-index
      # Glossary Contract (v7) — Stage 1 of 4-stage remediation: report-only.
      # See .claude/plan/glossary-contract.md §4.4 + glossary.config.yaml.
      # Flips to `check:glossary:strict` in Stage 4 once findings reach zero.
      - name: Glossary contract (Stage 1 — report-only)
        run: pnpm run check:glossary || true
        continue-on-error: true
      # report-only 诊断制品：上传仅供查阅，绝不应阻塞构建。
      # actions/upload-artifact 在组织级存储配额耗尽时会硬失败
      # （"Artifact storage quota has been hit"），该失败会传播并挂掉
      # build job——但 glossary findings 是 Stage 1 报告，不是质量门。
      # continue-on-error 把配额/基础设施抖动降级为非致命，门禁仍由
      # tsc/lint/test/on-prem-build 把守。
      - name: Upload glossary findings artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: glossary-findings
          path: glossary-findings.json
          if-no-files-found: ignore
      # PR-10: pnpm test:run 通过 vitest.config.ts 的 projects 配置自动跑
      # SaaS + on-prem 两种 deployment-mode。单 vitest 进程 + 共享 vite
      # cache，避免 fork 开销；总时间约为单模式的 2 倍（断言数翻倍，
      # ~9s → ~17s）—— 这是测试覆盖换来的可接受成本。
      - name: Run tests (saas + on-prem projects)
        run: pnpm test:run
      # 仅在 coverage provider 已安装时跑（可选，不阻塞 CI）。
      # Coverage 仅 saas project 收集 —— vitest.config.ts 注释解释为何。
      - name: Coverage (optional, saas project only)
        run: pnpm test:coverage --reporter=verbose || echo "::warning::Coverage skipped (install @vitest/coverage-v8 to enable)"
        continue-on-error: true

      # Drizzle drift 检查独立于 next build，前移到 build:next **之前**（Codex 审 Medium）：
      # 否则 drift 失败会在已产出/上传 standalone artifact 之后才 fail，白占存储。
      - name: Check Drizzle schema drift
        run: |
          pnpm db:generate 2>/dev/null || true
          if [ -n "$(git diff --name-only drizzle/)" ]; then
            echo "::error::Drizzle schema drift detected. Run 'pnpm db:generate' and commit the migration files."
            git diff drizzle/
            exit 1
          fi

      - run: pnpm run build:next

      # 复用 build 产物给 e2e job（时长优化）：原来 e2e job `needs: build` 却抛弃产物
      # 重新 `pnpm build:next`（~150s 重复）。改为这里把 standalone 产物打成单个 tar
      # 上传，e2e 下载解包复用。
      #
      # ★为何用 tar 而非 upload-artifact 直传目录：Next standalone 的
      # node_modules/next 等是 **symlink**（指向 standalone 内部的 .pnpm/）。
      # upload-artifact 逐文件上传对 symlink 跨 artifact 还原行为不可靠，且数千小文件
      # 上传/下载开销大。tar 原生保留 symlink 拓扑 + 单文件传输，既正确又更快。
      # 预先把 static/public 组装进 standalone（e2e Start server 原本做的 cp），
      # 打进同一 tar，e2e 端解包即用。
      - name: Package standalone build for e2e reuse
        run: |
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          [ -d public ] && cp -r public .next/standalone/public || true
          # ★symlink invariant 检查（Codex 审 Low）：standalone 的依赖是 symlink（指向内部
          # .pnpm/）。tar 只保拓扑，若未来 pnpm/Next tracing 变化产出**逃出 .next/standalone**
          # 的 symlink（如指向仓库根 node_modules），解包到别的 job 就会缺依赖。打包前断言
          # 所有 symlink 目标都落在 standalone 内，否则立即失败（宁可 CI 红，不发坏包）。
          ROOT="$(cd .next/standalone && pwd)"
          bad=0
          while IFS= read -r link; do
            tgt="$(python3 -c "import os,sys; print(os.path.realpath(sys.argv[1]))" "$link")"
            case "$tgt" in
              "$ROOT"/*) : ;;
              *) echo "::error::standalone symlink 逃出打包根: $link -> $tgt"; bad=1 ;;
            esac
          done < <(find .next/standalone -type l)
          [ "$bad" = "0" ] || { echo "::error::standalone 含逃逸 symlink，拒绝打包（避免 e2e 缺依赖）"; exit 1; }
          test -e .next/standalone/node_modules/next || { echo "::error::standalone/node_modules/next 不可解析"; exit 1; }
          # ★压缩用 zstd -1 而非 gzip：standalone 多为已压缩/压缩不友好的 js chunk + node_modules，
          # zstd -1 与 gzip 默认压缩率相当（同 ~17M）但打包快 ~40%（本地 72M 样本 3.4s→1.9s，
          # GH runner 慢 CPU 上差距更大）。ubuntu-latest 自带 zstd。tar 仍保 symlink 拓扑。
          tar --use-compress-program='zstd -1' -cf standalone.tar.zst -C .next standalone
          echo "standalone.tar.zst size: $(du -h standalone.tar.zst | cut -f1)"

      - name: Upload standalone tarball for e2e reuse
        uses: actions/upload-artifact@v7
        with:
          name: next-standalone
          path: standalone.tar.zst
          if-no-files-found: error
          retention-days: 1

      - name: Upload coverage to Codecov
        # Codecov v5+ requires a token even on public repos via the GHA;
        # token is optional but recommended. Skip the step entirely when
        # no token is configured to avoid the "failed to upload" warning
        # — coverage upload is non-blocking either way.
        if: always() && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: aster-cloud-test-results
          path: |
            test-results/
            coverage/
          if-no-files-found: ignore

  # E2E smoke — boots `next start` in background and runs the
  # vitest.e2e suite against it. Catches:
  #   - middleware redirect regressions (the next-intl loop we hit
  #     in the May 2026 standalone deploy)
  #   - server-rendered i18n drift on landing / pricing / hero
  #   - authenticated-route gate (login redirect)
  #
  # 时长优化后 `needs: build`——**复用** build job 打包的 standalone 产物（不再原地重新
  # build，省 ~150s）。因此 e2e 不再与 build 并行，而是串在其后；代价是 wall-clock 上
  # e2e 等 build 完成，但省掉的整个重复 build 远大于此。
  #
  # 测的是 production-shaped standalone server（`node server.js`，非 dev hot-reload），
  # 能抓 standalone server.js NODE_ENV hardcode 这类 dev 模式碰不到的问题。
  # runs-on 走 pick-runner 的动态标签（本地优先、不可用回落托管），与 build /
  # on-prem-build 同一机制。本 job 零 services:、仅需 node/pnpm/zstd/curl，
  # 已在 local-node runner 上实测通过（checkout + setup-node + npm 工具链均可用）。
  # ★必须有 timeout-minutes：本地 runner 若在探测后离线，job 会排队而非报错，
  #   没有超时就会挂到 GitHub 默认 24h。15 分钟足够（当前 e2e 约 3-5 分钟）。
  e2e:
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.labels) }}
    timeout-minutes: 15
    needs: [pick-runner, build]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      # 仍需 install：e2e 用 vitest 跑测试（devDependency，standalone 产物不含）。
      # 但**不再** build——复用 build job 打包的 standalone 产物（省 ~150s 重复 build）。
      - run: pnpm install --frozen-lockfile

      - name: Download + unpack standalone build from build job
        uses: actions/download-artifact@v8
        with:
          name: next-standalone
          path: .
      - name: Unpack standalone tarball
        run: |
          # 解包还原 .next/standalone（含已组装的 .next/static + public + symlink 依赖）。
          # 与 build job 一致用 zstd（tar 自动识别 .zst 扩展调 zstd 解压，ubuntu-latest 自带）。
          mkdir -p .next
          tar --use-compress-program='zstd -d' -xf standalone.tar.zst -C .next
          test -f .next/standalone/server.js || { echo "::error::standalone/server.js 缺失，解包异常"; exit 1; }

      - name: Start production server
        run: |
          # standalone 已由 build job 组装好 static/public（打进 tar），此处直接启动。
          # Start in background. Hostname 127.0.0.1 so it doesn't
          # try to bind to ::1 on dual-stack runners.
          #
          # ★注入全套 dummy SaaS env（Codex 审 High）：standalone server.js 保留外部
          # NODE_ENV，runner 未设时落到 production → src/instrumentation.ts 调
          # validateEnvOrThrow() 校验 SaaS 必填项（DATABASE/AUTH/CRON/APP_URL/HMAC +
          # STRIPE_SECRET/WEBHOOK + 6 个 STRIPE PRICE_ID + MIXPANEL + RESEND）。缺任一即
          # throw、instrumentation 崩、server 起不来。这些是编译期无关的 runtime 占位值，
          # 只为让 production-shaped server 通过 env 闸门启动（不接真实 Stripe/Mixpanel）。
          (cd .next/standalone && PORT=3001 HOSTNAME=127.0.0.1 \
            DEPLOYMENT_MODE=saas \
            DATABASE_URL='postgresql://noop:noop@localhost:5432/noop' \
            AUTH_SECRET='ci-e2e-secret-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx' \
            NEXTAUTH_SECRET='ci-e2e-secret-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx' \
            CRON_SECRET='ci-e2e-cron' \
            NEXT_PUBLIC_APP_URL='http://localhost:3001' \
            NEXTAUTH_URL='http://localhost:3001' \
            ASTER_PLAN_GATE_HMAC_KEY='ci-e2e-hmac' \
            STRIPE_SECRET_KEY='sk_test_ci_e2e_placeholder' \
            STRIPE_WEBHOOK_SECRET='whsec_ci_e2e_placeholder' \
            NEXT_PUBLIC_STRIPE_PRO_MONTHLY_PRICE_ID='price_ci_e2e_m_usd' \
            NEXT_PUBLIC_STRIPE_PRO_YEARLY_PRICE_ID='price_ci_e2e_y_usd' \
            NEXT_PUBLIC_STRIPE_PRO_MONTHLY_CNY_PRICE_ID='price_ci_e2e_m_cny' \
            NEXT_PUBLIC_STRIPE_PRO_YEARLY_CNY_PRICE_ID='price_ci_e2e_y_cny' \
            NEXT_PUBLIC_STRIPE_PRO_MONTHLY_EUR_PRICE_ID='price_ci_e2e_m_eur' \
            NEXT_PUBLIC_STRIPE_PRO_YEARLY_EUR_PRICE_ID='price_ci_e2e_y_eur' \
            NEXT_PUBLIC_MIXPANEL_TOKEN='ci_e2e_mixpanel_token' \
            RESEND_API_KEY='re_ci_e2e_placeholder' \
            node server.js > /tmp/e2e-server.log 2>&1 &)
          # Wait up to 30s for the server to accept requests. Probe / —
          # next-intl rewrites it to /en internally and serves SSR
          # within ~3s on a cold-start GitHub runner.
          # ★readiness 硬失败（Codex 审 High）：原版循环 30 次后即使 server 没起来也不
          # exit 1，而 test:e2e 用 skipIf(!serverReachable) → server 起不来会静默 0-test
          # 假绿，掩盖 artifact 复用坏包 / env throw / 端口问题。改为超时即打印 server log
          # 并 exit 1，让 e2e 真正证明「复用的 standalone 产物能启动」。
          ready=0
          for i in $(seq 1 30); do
            sleep 1
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/ || echo 000)
            if [ "$code" = "200" ] || [ "$code" = "307" ]; then
              echo "server ready (HTTP $code) after ${i}s"
              ready=1
              break
            fi
          done
          if [ "$ready" != "1" ]; then
            echo "::error::e2e server 未在 30s 内就绪——复用的 standalone 产物可能启动失败。server log:"
            echo "::group::/tmp/e2e-server.log"
            cat /tmp/e2e-server.log || true
            echo "::endgroup::"
            exit 1
          fi

      - name: Run e2e suite
        env:
          E2E_BASE_URL: http://localhost:3001
        run: pnpm test:e2e

      - name: Upload server log on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: e2e-server-log
          path: /tmp/e2e-server.log
          if-no-files-found: ignore

  # Cloudflare's git integration auto-deploys from main on every push,
  # so there is no GitHub Actions deploy job here. (Previous attempts to
  # add one created two parallel deploys racing for the same Worker.)
  # Operator: configure deploys at
  # https://dash.cloudflare.com/?to=/:account/workers/services/view/aster-cloud
  # The git build must set CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE
  # to any non-empty placeholder (e.g. postgres://placeholder) — wrangler
  # 4.92's deploy preflight reads it even though prod uses the bound
  # Hyperdrive at runtime. Without this dummy value, OpenNext's deploy
  # wrapper aborts with "no local hyperdrive connection string".

  # On-prem build verification — ensures the deployment-mode flag work
  # (v2 plan) is not regressed by future PRs. Runs in parallel with `build`.
  #
  # 失败常见原因 & 修复方向（按 verify scripts 输出的规则名）：
  #   "stripe import"          → src/lib/stripe.ts hot-gate 或 alias 失效
  #   "STRIPE_SECRET_KEY literal" → 某 SaaS-only 路由的 env 访问没用直接
  #                                 __DEPLOYMENT_MODE__ macro 守门
  #   "href to /billing"       → 某 client 组件加了 SaaS-only 链接但忘了
  #                              wrap CLIENT_CAPABILITIES.billing
  # 详见 .claude/plan/saas-only-inventory.md §17 PR-4 checklist。
  on-prem-build:
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.labels) }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: On-prem build
        env:
          DEPLOYMENT_MODE: on-prem
        run: pnpm build

      - name: Verify on-prem bundle does not bundle SaaS SDKs / secrets
        run: pnpm verify:on-prem-bundle

      - name: Verify on-prem UI does not link to SaaS-only routes
        run: pnpm verify:on-prem-ui

      - name: Audit transitive deps in on-prem build (informational)
        run: pnpm verify:packages
        continue-on-error: true

      - name: Upload on-prem build artifacts on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: on-prem-build-failed
          path: |
            .open-next/worker.js
            .open-next/server-functions/default/handler.mjs
          if-no-files-found: ignore
          retention-days: 7

  build-migrate-image:
    # 仅在 main 分支 push 时跑（PR 不构建/推镜像）
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # 必须等 SaaS build + on-prem build 都过，才推 migrate 镜像 ——
    # 防止 on-prem 回归被推到 production
    needs: [build, on-prem-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # cosign keyless 签名需要 OIDC token（Fulcio 证书 + Rekor 透明日志）。
      id-token: write
    # digest-pin Phase 2：把已验签 migrate digest 暴露给下游 image-pin-pr job。
    outputs:
      digest: ${{ steps.migrate-build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ★只推不可变 SHA tag，**不推 :latest**。理由（Codex 实现审查 High）：若在此就推
      # :latest，而后续 verify 失败，:latest 已指向未验签 digest → 下次任何 aster-cloud app
      # sync / 手动迁移仍会拉到它（k3s 仍按 :latest 跑）。故把 :latest 的提升挪到 verify 之后，
      # 保证 :latest **永远只指向已验签 digest**（见下方 Promote 步骤）。
      - name: Build & push migrate image
        id: migrate-build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.migrate
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            docker.io/wontlost/aster-cloud-migrate:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 统一 digest pin 设计 Phase 0（#192）：对齐 aster-api 主镜像的 cosign keyless
      # 签名，给迁移镜像补上产物真实性打底。sign/verify 均对 build-push-action 输出的
      # **不可变 digest**（非浮动 tag），签名身份绑定本 workflow 的 OIDC。
      # 顺序：push(SHA) → sign → verify → **promote :latest** → sync，保证 :latest 只指向
      # 已验签 digest（verify 失败则 :latest 不动、sync 不触发）。
      #
      # ⚠️ 边界（如实标注，勿夸大）：本步只保证"迁移镜像被本仓 workflow 签过、:latest 只指向
      # 已验签 digest"。集群目前**未强制 admission 校验**、**未做 GitOps digest pin**（仍按
      # :latest 拉取，只是该 tag 现在保证已验签）——admission + by-digest GitOps 是统一设计的
      # Phase 1-3（k3s image-lock + verify workflow + 分支保护），单独立项。不声称"部署链已闭合"。
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # ★必须显式 pin cosign 版本，不能只 pin installer。
          #   installer 从 @v3 升到 v4.1.2 时，其**默认 cosign-release 由 v2.5.2
          #   变成 v3.0.6**，而 cosign v3 把 `--new-bundle-format` 设为默认：
          #   签名改存为 OCI 1.1 referring artifact，旧路径找不到 →
          #   `no signatures found`（2026-08-01 实测，本 job 与 aster-api 三个
          #   deploy workflow 同时开始失败）。
          #   生产验签方 policy-controller 的内置 cosign 版本未知，已部署镜像
          #   全是 v2 attached 格式——贸然切 v3 可能让准入拒绝所有新镜像。
          #   升 v3 需单独评估，先确认 policy-controller 支持 new bundle 格式。
          cosign-release: 'v2.5.2'

      - name: Sign migrate image digest (keyless)
        env:
          COSIGN_YES: "true"
          DIGEST: ${{ steps.migrate-build.outputs.digest }}
        run: |
          test -n "${DIGEST}" || { echo "build 未输出 digest，中止"; exit 1; }
          REF="docker.io/wontlost/aster-cloud-migrate@${DIGEST}"
          # 身份判据与下游 fail-closed verify 步骤逐字一致(单一真相,勿分叉)。
          ID_REGEXP="^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/ci\.yml@refs/heads/main$"
          OIDC_ISSUER="https://token.actions.githubusercontent.com"

          # 幂等守卫:该 digest 是否已被本仓身份签过?用 --insecure-ignore-tlog **只探证书身份、
          # 不触 Rekor**——避开「签名已存在→取旧 Rekor inclusion proof→404」的抖动路径(重跑 CI
          # 时常命中,一次 Rekor 打嗝就噪声红)。已签则跳过重签。
          # ★不放松 fail-closed:trust 由下方独立的 full verify(带 tlog)兜底,本守卫只决定「要不要
          #   重签」不决定「能不能放行」;即便误判已签,下游 full verify 仍会独立验签,未签好照样红。
          if cosign verify "${REF}" \
               --insecure-ignore-tlog \
               --certificate-identity-regexp "${ID_REGEXP}" \
               --certificate-oidc-issuer "${OIDC_ISSUER}" >/dev/null 2>&1; then
            echo "digest 已被本仓身份签过，跳过重签(幂等):${DIGEST}"
            exit 0
          fi

          # 未签 → 新签,带退避 retry 兜 Rekor 瞬时抖动(仅重试签名上传本身,不改签名语义)。
          for attempt in 1 2 3; do
            if cosign sign "${REF}"; then
              echo "signed digest=${DIGEST} (attempt ${attempt})"
              exit 0
            fi
            echo "cosign sign 第 ${attempt} 次失败(Rekor 抖动?),退避重试…"
            sleep $((attempt * 5))
          done
          echo "cosign sign 连续 3 次失败,中止"; exit 1

      # fail-closed：签名/身份不符 → verify 失败 → job 失败（:latest 不提升、迁移 sync 不触发）。
      - name: Verify freshly-built migrate digest signature
        env:
          DIGEST: ${{ steps.migrate-build.outputs.digest }}
        run: |
          cosign verify "docker.io/wontlost/aster-cloud-migrate@${DIGEST}" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/ci\.yml@refs/heads/main$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      # ── Phase 3 P3-2b：已移除 `Promote :latest` + `Trigger ArgoCD sync` 旧发布语义 ──
      # P3-0 后 migrate 也走 GitOps by-digest：image-pin-pr job 开 PR 改 k3s migrate digest →
      # verify-image-pin → auto-merge → ArgoCD sync → PostSync 迁移 hook 按新 digest 跑。
      # 旧的 promote :latest（浮动 tag）+ 构建后立即 trigger-sync（此时 git digest 未更新,sync
      # 的仍是旧 digest）在 by-digest 下已非有效发布通道,故删除。
      # #187 的 fail-loud（CI 必须知道迁移是否真应用）由下方 image-pin-pr job 的
      # 「Wait for migration applied」步骤继承（PR 合并后 POST sync + 轮询至 synced revision 的
      # migrate digest == 本次 digest + Healthy + operation Succeeded）。


  # ── aster-lsp 镜像：构建 + cosign keyless 签名（issue aster-deploy#9 前置）─────
  #
  # ★为什么新建：lsp 镜像此前**完全没有 CI**——只靠本地 `task deploy:lsp` 用 podman 推
  #   可变 tag 0.0.9，且**从未签过名**。而 k3s 的 digest-pin 体系是 fail-closed 的：
  #   verify-image-pin 必须 `cosign verify` 并绑定源仓 workflow 身份 + sourceSha。
  #   所以「把 lsp 纳入 digest-pin」的第一前置就是本 job——先有可验签的不可变 digest。
  #
  # ★与 build-migrate-image 逐条同构（刻意不另起一套）：同样只推不可变 SHA tag、
  #   同样 pin cosign v2.5.2（见该 job 注释里记录的 v3 new-bundle 事故）、
  #   同样先签后 fail-closed verify。Dockerfile.lsp 本就在本仓，构建上下文一致。
  #
  # ⚠️ 边界（如实标注）：本 job 只产出**已签名的不可变 digest**。lsp 目前
  #   **不在 ArgoCD 管理下**（apps/aster-lang/lsp 无 kustomization.yaml，而 appset 按
  #   `apps/aster-lang/*/kustomization.yaml` glob 发现应用），故这里**不开 image-pin PR**——
  #   开了也没有部署载体可 pin。让 ArgoCD 接管 lsp 是独立的生产 cutover，单独立项。
  build-lsp-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # cosign keyless 签名需要 OIDC token（Fulcio 证书 + Rekor 透明日志）。
      id-token: write
    outputs:
      digest: ${{ steps.lsp-build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ★只推不可变 SHA tag，不推可变 tag（如既有的 0.0.9）。可变 tag + 生产
      #   imagePullPolicy: IfNotPresent 正是 aster-deploy#9 的成因：节点有缓存时
      #   rollout restart 会静默继续跑旧镜像。
      - name: Build & push lsp image
        id: lsp-build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.lsp
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            docker.io/wontlost/aster-lsp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # ★与 build-migrate-image 同一版本，理由见该 job 注释：installer v4 的默认
          #   cosign-release 是 v3，而 v3 默认 --new-bundle-format 会让旧路径
          #   `no signatures found`。必须显式 pin。
          cosign-release: 'v2.5.2'

      - name: Sign lsp image digest (keyless)
        env:
          COSIGN_YES: "true"
          DIGEST: ${{ steps.lsp-build.outputs.digest }}
        run: |
          test -n "${DIGEST}" || { echo "build 未输出 digest，中止"; exit 1; }
          REF="docker.io/wontlost/aster-lsp@${DIGEST}"
          # 身份判据与下方 fail-closed verify 步骤逐字一致（单一真相，勿分叉）。
          ID_REGEXP="^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/ci\.yml@refs/heads/main$"
          OIDC_ISSUER="https://token.actions.githubusercontent.com"

          # 幂等守卫：与 migrate job 同一写法——用 --insecure-ignore-tlog 只探证书身份、
          # 不触 Rekor，避开「签名已存在→取旧 inclusion proof→404」的抖动路径。
          # 不放松 fail-closed：trust 由下方带 tlog 的独立 full verify 兜底。
          if cosign verify "${REF}" \
               --insecure-ignore-tlog \
               --certificate-identity-regexp "${ID_REGEXP}" \
               --certificate-oidc-issuer "${OIDC_ISSUER}" >/dev/null 2>&1; then
            echo "digest 已被本仓身份签过，跳过重签（幂等）：${DIGEST}"
            exit 0
          fi

          for attempt in 1 2 3; do
            if cosign sign "${REF}"; then
              echo "signed digest=${DIGEST} (attempt ${attempt})"
              exit 0
            fi
            echo "cosign sign 第 ${attempt} 次失败（Rekor 抖动?），退避重试…"
            sleep $((attempt * 5))
          done
          echo "cosign sign 连续 3 次失败，中止"; exit 1

      # fail-closed：签名/身份不符 → verify 失败 → job 失败。
      - name: Verify freshly-built lsp digest signature
        env:
          DIGEST: ${{ steps.lsp-build.outputs.digest }}
        run: |
          cosign verify "docker.io/wontlost/aster-lsp@${DIGEST}" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/ci\.yml@refs/heads/main$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Summary
        env:
          DIGEST: ${{ steps.lsp-build.outputs.digest }}
        run: |
          {
            echo "### aster-lsp 镜像已签名"
            echo ""
            echo "- digest: \`${DIGEST}\`"
            echo "- tag: \`docker.io/wontlost/aster-lsp:${GITHUB_SHA}\`（不可变）"
            echo ""
            echo "⚠️ lsp 尚未在 ArgoCD 管理下（apps/aster-lang/lsp 无 kustomization.yaml），"
            echo "故本次**不开 image-pin PR**。接管 + pin 见 aster-deploy#9。"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 统一 digest pin 设计 A′ Phase 2：CI 开 PR 到 k3s 改 migrate image-lock ──────
  # 见 wontlost-ltd/k3s#4、k3s .github/image-pin/。独立 job：fail-loud 但**不阻塞**上面的
  # migrate 发布路径（Phase 2 期间 :latest promote + trigger sync 与 digest PR 并存）。
  # ⚠️ 暂态：image-lock PR 合并触发 ArgoCD sync + 上面 trigger-sync ＝ PostSync 迁移可能多跑
  # 一次；migrate Job 幂等（__drizzle_migrations + IF NOT EXISTS），重跑安全。Phase 3 收敛。
  #
  # 前置（人工，见 k3s SETUP.md）：本仓需配 vars.IMAGE_PIN_APP_ID +
  # secrets.IMAGE_PIN_APP_PRIVATE_KEY（image-pin App id 4253193 私钥）。未配置则本 job skip。
  image-pin-pr:
    needs: build-migrate-image
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.IMAGE_PIN_APP_ID != '' }}
    runs-on: ubuntu-latest
    # Production environment：Wait-for-migration 步骤需 ARGOCD_AUTH_TOKEN（Production env secret）。
    environment: production
    concurrency:
      group: image-pin-pr-aster-cloud-migrate     # per-image：不与 aster-api 的 job 互相取消
      cancel-in-progress: true
    steps:
      - name: Final stale gate (再确认 github.sha 仍是 origin/main tip)
        id: stalegate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 转私后匿名 ls-remote 会索要用户名 → exit 128（aster-api 实测）。
          # 改用 gh api，并显式传 GH_TOKEN。
          tip="$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)"
          echo "this run: ${GITHUB_SHA}  origin/main tip: ${tip}"
          if [ "${GITHUB_SHA}" != "${tip}" ]; then
            echo "::notice::main 已前进，本 run 过时 → 跳过 image-pin PR（下次 push 重建固定分支）"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint k3s-scoped token (跨 org：App 装在 wontlost-ltd/k3s)
        if: ${{ steps.stalegate.outputs.skip != 'true' }}
        id: k3stoken
        uses: actions/create-github-app-token@v3.2.0
        with:
          # client-id 取代已弃用的 app-id（create-github-app-token@v3 弃用警告）。
          client-id: ${{ vars.IMAGE_PIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.IMAGE_PIN_APP_PRIVATE_KEY }}
          owner: wontlost-ltd
          repositories: k3s
          permission-contents: write
          permission-pull-requests: write

      # checkout 本仓以取用共享脚本（image-pin-pr 是独立 job，需自己 checkout）。
      - name: Checkout (for shared script)
        if: ${{ steps.stalegate.outputs.skip != 'true' }}
        uses: actions/checkout@v7

      - name: Open/update image-pin PR to k3s
        id: openpr
        if: ${{ steps.stalegate.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ steps.k3stoken.outputs.token }}
          DIGEST: ${{ needs.build-migrate-image.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          bash scripts/ci/open-image-pin-pr.sh \
            docker.io/wontlost/aster-cloud-migrate image-pin/aster-cloud-migrate

      # ── Phase 3 P3-2b：迁移 fail-loud（继承 #187，替代旧 trigger-sync）──
      # image-pin PR 合并后主动 sync ArgoCD 并轮询至：synced revision 的 kustomization migrate
      # digest == 本次 digest + health Healthy + operation Succeeded。任何超时/Degraded/Failed
      # → job 红。迁移「构建成功但未应用」不再静默（by-digest 下 selfHeal 会 sync，但显式 POST
      # 更快更确定；判定用 digest-contains 而非 merge-sha equality，抗并发）。
      - name: Wait for migration applied (fail-loud, #187)
        # 仅在本次确有 migrate digest 变更 + 开/复用了 PR 时等待（脚本明确输出 wait_required,
        # 不从历史 --state all 反推 PR — Codex 审查必修）。
        if: ${{ steps.stalegate.outputs.skip != 'true' && steps.openpr.outputs.wait_required == 'true' }}
        env:
          K3S_TOKEN: ${{ steps.k3stoken.outputs.token }}    # 读 k3s content（跨 org）
          ARGOCD_SERVER: argocd.aster-lang.cloud
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          DIGEST: ${{ needs.build-migrate-image.outputs.digest }}
          PR: ${{ steps.openpr.outputs.pr_number }}
        run: |
          set -euo pipefail
          [ -n "$ARGOCD_AUTH_TOKEN" ] || { echo "::error title=migration not verified::ARGOCD_AUTH_TOKEN 未配置（Production env）→ 无法确认迁移已应用。详见 #187。"; exit 1; }
          [ -n "$PR" ] || { echo "::error::wait_required=true 但 pr_number 空（脚本输出异常）"; exit 1; }

          # 1) 等**本次** PR 合并（按明确 pr_number,非历史反推）。auto-merge 依赖 verify-image-pin 过。
          for i in $(seq 1 80); do   # ~20min
            state="$(GH_TOKEN="$K3S_TOKEN" gh pr view "$PR" -R wontlost-ltd/k3s --json state --jq .state)"
            case "$state" in
              MERGED) echo "PR #$PR 已合并"; break ;;
              CLOSED) echo "::error title=migration not applied::image-pin PR #$PR 已关闭未合并 → 迁移未上线。"; exit 1 ;;
            esac
            [ "$i" = 80 ] && { echo "::error title=migration not applied::等 PR #$PR 合并超时（verify-image-pin 未过？）→ 迁移未上线。详见 #187。"; exit 1; }
            sleep 15
          done

          # 2) 主动 POST ArgoCD sync（比 selfHeal 快且确定；ci-migrate 有 sync 权限,空 body）。
          #    ★容忍「operation already in progress」（selfHeal / aster-api PR 可能已在 sync）——
          #      非致命,进入轮询即可（Codex 审查必修:409/in-progress 不该红）。
          sync_out="$(curl --silent --show-error -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer $ARGOCD_AUTH_TOKEN" -H "Content-Type: application/json" \
            "https://$ARGOCD_SERVER/api/v1/applications/aster-cloud/sync" -d '{}' 2>&1 || true)"
          code="$(printf '%s' "$sync_out" | tail -n1)"
          if [ "$code" = "200" ]; then
            echo "ArgoCD sync 已触发"
          elif printf '%s' "$sync_out" | grep -qiE "another operation is already in progress|already in progress|409"; then
            echo "::notice::ArgoCD 已有 operation 在进行（selfHeal/其它 PR）→ 跳过 POST,直接轮询"
          else
            echo "::error title=ArgoCD sync failed::触发 sync 失败 (code=${code}) → 迁移可能未应用。详见 #187。"; exit 1
          fi
          echo "轮询至 synced revision 的 migrate digest == ${DIGEST} + Healthy + Succeeded..."

          # 4) 轮询：ArgoCD 已 sync 到「包含本次 migrate digest」的 k3s revision + 健康 + 成功。
          for i in $(seq 1 40); do   # ~7min
            app="$(curl --fail --silent --show-error -H "Authorization: Bearer $ARGOCD_AUTH_TOKEN" \
                   "https://$ARGOCD_SERVER/api/v1/applications/aster-cloud")"
            sync_status="$(echo "$app" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("status",{}).get("sync",{}).get("status",""))')"
            health="$(echo "$app" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("status",{}).get("health",{}).get("status",""))')"
            phase="$(echo "$app" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("status",{}).get("operationState",{}).get("phase",""))')"
            rev="$(echo "$app" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("status",{}).get("sync",{}).get("revision",""))')"
            echo "  [$i] sync=$sync_status health=$health phase=$phase rev=${rev:0:8}"
            case "$phase" in Failed|Error) echo "::error title=migration failed::ArgoCD operation phase=$phase → 迁移未成功。查 PostSync hook 日志。详见 #187。"; exit 1 ;; esac
            # rev 形状校验（40-hex）——异常 revision 不进 GitHub contents API（Codex 建议）。
            if [ "$sync_status" = "Synced" ] && [ "$health" = "Healthy" ] && [[ "$rev" =~ ^[0-9a-f]{40}$ ]]; then
              # 校验该 revision 的 kustomization migrate digest == 本次 digest（抗并发,非 merge-sha equality）。
              deployed="$(GH_TOKEN="$K3S_TOKEN" gh api \
                "repos/wontlost-ltd/k3s/contents/apps/aster-lang/cloud/kustomization.yaml?ref=${rev}" \
                --jq '.content' | base64 -d \
                | python3 -c 'import sys,yaml;d=yaml.safe_load(sys.stdin);print(next((i["digest"] for i in d.get("images",[]) if i.get("name")=="docker.io/wontlost/aster-cloud-migrate"),""))')"
              if [ "$deployed" = "$DIGEST" ]; then echo "✅ 迁移已应用：ArgoCD synced rev=${rev:0:8} migrate digest==${DIGEST} Healthy"; exit 0; fi
              echo "  (已 Synced/Healthy 但 rev 的 migrate digest=${deployed} != ${DIGEST}, 继续等更新 revision)"
            fi
            sleep 10
          done
          echo "::error title=migration not verified::等 ArgoCD sync 到含本次 migrate digest 的 revision 超时 → 迁移状态未知,需人工确认。详见 #187。"
          exit 1
