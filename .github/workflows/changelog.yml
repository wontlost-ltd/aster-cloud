# Changelog generator.
#
# Trigger: push to main, AND release tag creation.
#   - On push to main: open/update a **changelog PR**（不再直推 main）。
#   - On tag: cut a versioned section and commit直推（release 是刻意动作，且 tag 事件
#     不驱动 image-pin 部署链）。
#
# ★ 为什么 push 到 main 不再直推（wontlost-ltd/k3s#4 / digest-pin 全链上线实测）：
#   此前每次 main push 后 bot 直推 `docs(changelog): update [skip ci]` 到 main。这把 main tip
#   推成一个「无构建产物」的 [skip ci] commit → digest-pin 的 freshness 不变式
#   （sourceSha == main HEAD）永远匹配不上（真实 commit 的 run 因 tip 变 changelog 而 stale
#   跳过；changelog commit [skip ci] 不触发 CI）→ image-pin PR 永远开不出。
#   Codex 审查确认根治=changelog 不污染 main tip（而非在 freshness 上加 [skip ci] 特例——
#   那会让攻击者把真实变更藏进 [skip ci] commit 绕过 latest-only）。改为开 PR。
#
# Implementation: git-cliff parses commit messages (Conventional Commits) 渲染 CHANGELOG.md。

name: changelog

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "CHANGELOG.md"  # avoid loop on the bot's own changelog change
  workflow_dispatch:

permissions:
  contents: write        # tag 路径直推 CHANGELOG.md
  pull-requests: write   # push-to-main 路径开/更新 changelog PR

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # git-cliff needs full history

      - name: Run git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --output CHANGELOG.md

      - name: No change → done
        id: diff
        run: |
          if [ -z "$(git status --porcelain CHANGELOG.md)" ]; then
            echo "CHANGELOG.md unchanged — nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # ── tag 事件：优先直推（release 刻意动作；不驱动 image-pin 链），推不动则退化为 PR ──
      #
      # ★2026-08-02：main 已启用分支保护（禁直推）。${{ github.token }} 是 GitHub Actions App
      #   的安装令牌，直推会被 `GH006: Protected branch update failed` 拒绝。
      #   GitHub Actions **不能**作为 ruleset 的 bypass actor（repo 级与 org 级均报
      #   "Actor GitHub Actions integration must be part of the ruleset source or owner
      #   organization"，team plan 也一样），故无法靠放行令牌解决。
      #   本仓也没有 admin PAT（对比 aster-lang-test 用 CROSS_REPO_TOKEN 直推）。
      #
      #   处理：直推失败**不让发版流水线变红**，自动退化为开 PR。CHANGELOG 是派生物，
      #   晚几分钟合入不影响发版本身；但绝不静默丢弃——退化路径会留下可见的 PR。
      - name: Commit changelog on tag (direct, fallback to PR)
        if: ${{ steps.diff.outputs.changed == 'true' && startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          # ★跳过标记只在**直推 main** 时有意义（避免把 main tip 推成无构建产物的
          #   commit、打断 digest-pin freshness 不变式）。一旦退化成开 PR，它就会
          #   让分支保护要求的三项检查永不运行 → PR 永远 BLOCKED。
          #   故先按直推形态提交；若直推失败，改写 message 去掉标记再开 PR。
          git commit -m "docs(changelog): release ${GITHUB_REF_NAME} [skip ci]"
          if git push origin HEAD:main 2>/tmp/push-err; then
            echo "✓ changelog 已直推 main"
            exit 0
          fi
          echo "::warning::直推 main 失败（分支保护），退化为开 PR："
          cat /tmp/push-err
          # 去掉跳过标记——PR 路径需要 CI 真实运行才能满足分支保护。
          git commit --amend -m "docs(changelog): release ${GITHUB_REF_NAME}"
          BRANCH="chore/changelog-${GITHUB_REF_NAME}"
          git push --force-with-lease origin "HEAD:${BRANCH}"
          if [ -z "$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "docs(changelog): release ${GITHUB_REF_NAME}" \
              --body "发版 ${GITHUB_REF_NAME} 的 CHANGELOG 版本化小节。因 main 启用分支保护、且 GitHub Actions 无法作为 ruleset bypass actor，改由本 PR 合入。"
          fi

      # ── push-to-main 事件：开/更新 changelog PR（★不直推 main，避免污染 tip）──
      - name: Open/update changelog PR (push to main)
        if: ${{ steps.diff.outputs.changed == 'true' && github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: chore/changelog-unreleased
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add CHANGELOG.md
          # ★不带跳过标记：这条 commit 落在 **PR 分支**上，而 main 的分支保护要求
          #   build / on-prem-build / e2e 三项必过。带上跳过标记 → 这三项永远不运行
          #   → PR 永远 BLOCKED、永远合不掉（#392 曾因此卡了两周，#446 又原样复现）。
          #
          #   当初加它是为了「不污染 main tip 的 digest-pin freshness 基线」，
          #   那个理由只对**直推 main** 成立；改开 PR 后 tip 不再被污染，
          #   标记失去了原有作用，只剩下副作用。
          #
          #   代价：每次 changelog 刷新会跑一次完整 CI（约 8 分钟）。用 PR 换
          #   「能合并」是划算的——一个永远合不掉的 PR 等于这条流水线白跑。
          git commit -m "docs(changelog): refresh unreleased"
          git push --force-with-lease origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "docs(changelog): refresh unreleased" \
              --body "自动生成的 CHANGELOG.md 刷新（git-cliff）。合并可选——changelog 是派生物。不直推 main 以避免污染 digest-pin freshness 基线（见 workflow 注释）。"
          fi
