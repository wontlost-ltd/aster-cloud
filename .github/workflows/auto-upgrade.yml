name: Auto Upgrade aster-lang-ts

# 拉取模型：aster-lang-ts 发版后不再跨 org 推送触发本 workflow（跨 org 凭据刻意不放宽），
# 改由本仓每日定时查 npm 最新版，与 package.json 钉版比较后决定是否开升级 PR。
# 也可手动触发；version 留空即取 npm latest。
# 决策逻辑在 scripts/resolve-aster-lang-upgrade.mjs（有单测）。
on:
  schedule:
    # 每日一次。未发新版时只跑轻量的 resolve job（稀疏检出 + npm view），成本可忽略。
    - cron: '23 21 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'aster-lang-ts 版本（如 1.0.32 或 v1.0.32）；留空取 npm latest'
        required: false
        default: ''

# 同一时刻只允许一个升级流程，避免定时与手动触发并发推同一分支。
concurrency:
  group: auto-upgrade-aster-lang-ts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    # ★所有 job 必须有 timeout（见 ci.yml 同类说明）。
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      action: ${{ steps.decide.outputs.action }}
      version: ${{ steps.decide.outputs.version }}
      branch: ${{ steps.decide.outputs.branch }}
    steps:
      # 只需 package.json 与决策脚本：稀疏检出让「已是最新」的日常空跑保持廉价。
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            package.json
            scripts/resolve-aster-lang-upgrade.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Decide (latest vs pinned, open PR check)
        id: decide
        env:
          # 输入经 env 传入，不直接拼进 shell，避免注入；脚本内再做严格版本格式校验。
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/resolve-aster-lang-upgrade.mjs resolve

  upgrade:
    needs: resolve
    if: ${{ needs.resolve.outputs.action == 'upgrade' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      BRANCH: ${{ needs.resolve.outputs.branch }}
    steps:
      # 用 App 令牌推分支、开 PR，与 changelog.yml 同一做法（#455）：
      # public 仓库对 bot（github.token）触发的 run 挂 action_required，required checks 永不报告；
      # App 令牌触发的 pull_request CI 照常自动运行，且不放宽外部贡献者的审批策略。
      # 未配凭据时回落 github.token：PR 仍会开出，但 CI 需人工处理，warning 说明原因。
      - name: Mint App token (avoids bot-triggered approval gate)
        id: apptoken
        if: ${{ vars.IMAGE_PIN_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.IMAGE_PIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.IMAGE_PIN_APP_PRIVATE_KEY }}
          owner: wontlost-ltd
          repositories: aster-cloud
          permission-contents: write
          permission-pull-requests: write

      - name: Resolve token (App token, fallback to github.token)
        id: tok
        env:
          APP_TOKEN: ${{ steps.apptoken.outputs.token }}
          FALLBACK: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${APP_TOKEN:-}" ]; then
            echo "::add-mask::${APP_TOKEN}"
            echo "token=${APP_TOKEN}" >> "$GITHUB_OUTPUT"
            echo "bot=aster-image-pin[bot]" >> "$GITHUB_OUTPUT"
            echo "::notice::使用 App 令牌 —— 升级 PR 的 CI 将自动运行"
          else
            echo "::add-mask::${FALLBACK}"
            echo "token=${FALLBACK}" >> "$GITHUB_OUTPUT"
            echo "bot=github-actions[bot]" >> "$GITHUB_OUTPUT"
            echo "::warning::未配 IMAGE_PIN_APP_CLIENT_ID，回落 github.token —— 升级 PR 的 CI 不会自动运行（见 #455）"
          fi

      # checkout 必须带同一令牌：git push 用的是 checkout 写入的凭据，push 决定 CI run 的触发者。
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.tok.outputs.token }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # package.json 与 lsp-package.json 必须同步钉到同一精确版本（check-lsp-pin 守护）。
      - name: Bump package.json and lsp-package.json in lockstep
        run: |
          set -euo pipefail
          pnpm add --save-exact "@aster-cloud/aster-lang-ts@${VERSION}"
          node scripts/resolve-aster-lang-upgrade.mjs bump-pins "${VERSION}"
          node scripts/check-lsp-pin.mjs

      - run: pnpm test:run
      - run: pnpm run build:next

      - name: Create upgrade PR
        env:
          GH_TOKEN: ${{ steps.tok.outputs.token }}
          BOT: ${{ steps.tok.outputs.bot }}
        run: |
          set -euo pipefail
          # 提交身份跟随所用令牌，便于日后排查「谁推的」。
          git config user.name "${BOT}"
          git config user.email "${BOT}@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add package.json pnpm-lock.yaml lsp-package.json
          git commit -m "chore(deps): upgrade @aster-cloud/aster-lang-ts to ${VERSION}"
          # 分支可能残留自已关闭的旧 PR；该分支专属本 workflow，强推覆盖即可。
          git push --force origin "HEAD:refs/heads/${BRANCH}"
          gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "chore(deps): upgrade aster-lang-ts to ${VERSION}" \
            --body "$(cat <<BODY
          Automated upgrade of \`@aster-cloud/aster-lang-ts\` to \`${VERSION}\` (pulled from npm by the scheduled auto-upgrade workflow).

          - \`package.json\` and \`lsp-package.json\` bumped in lockstep
          - \`pnpm test:run\` and \`pnpm run build:next\` passed in the upgrade run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          BODY
          )"
