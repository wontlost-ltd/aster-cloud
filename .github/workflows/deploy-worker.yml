name: Deploy Worker

# 生产 Worker 的唯一自动发布路径。Cloudflare Workers Builds 对 main 的自动构建必须关闭，
# 运维前置及证据见 k3s 仓 docs/runbooks/release-evidence.md；本地 pnpm deploy 仅为 break-glass。

# 把 Cloudflare Worker 的部署从「dashboard 里的 Git 集成」搬进 CI。
#
# ★为什么必须搬（2026-07-30 实测事故）：本仓从 aster-cloud org 转到 wontlost-ltd 后，
#   Cloudflare 的 Git 集成**静默失效**——它绑定的是「GitHub App 安装 + 具体 repo」，
#   换 owner 后原绑定不再生效，webhook 不再触发构建。
#   证据：转仓前每个 main commit 都有 `Workers Builds: aster-cloud: success` 检查，
#   转仓后 8 个 commit **一个都没有**；Worker 的 modified_on 停在 07-30T00:39Z，
#   而此后 10+ 小时合并的 9 个 PR 全部未上线。
#   最危险的是**CI 全绿但没部署**——部署真相不在 git 里，没人会发现。
#
# 搬进 CI 后：部署与 main push 同源可见、失败会红、回滚就是 revert + 重跑。
# 这与本仓 aster-api 侧「发布真相 = image-pin PR 进 git」的做法一致。
#
# ★★★ 当前**默认关闭**（需显式开启）—— 2026-07-30 复审发现双路部署 ★★★
#   实测：CI 于 11:28:03 部署完成，而 Worker 的 modified_on 在 11:29:43 又变了一次
#   （晚 100 秒），且 main 上重新出现 `Workers Builds: aster-cloud: success` 检查
#   → **Cloudflare Git 集成在 GitHub App 授权恢复后又活了**，与本 workflow 形成双路。
#
#   双路部署的危害：
#     1. 竞态——两条路各自 build 后 deploy，上线版本取决于谁后完成，不确定；
#     2. 回滚失效——revert 后一条部署旧版、另一条可能又推新版；
#     3. 配置漂移——dashboard 的 build 命令与 package.json 的 deploy 脚本若不一致，
#        产物就不一致，且**没有任何红灯**；
#     4. 双倍 Next.js 构建开销。
#
#   故本 workflow 现由 `vars.ENABLE_CI_WORKER_DEPLOY` 显式门控，默认不跑。
#   ☐ 启用步骤（二者必须同时做，否则又变双路）：
#     1. 在 Cloudflare dashboard 断开 Git 集成：
#        Workers & Pages → aster-cloud → Settings → Build → 断开 GitHub 连接
#     2. 设 repo variable：`gh variable set ENABLE_CI_WORKER_DEPLOY --body true`
#   在第 1 步完成前**不要**开启本 workflow。
#
# 前置 secret / vars（转仓时 repo 级 secret 已保留，environment 级不会）：
#   secrets.CF_API_TOKEN           —— 需 Workers Scripts:Edit + Workers KV:Edit
#                                     （OpenNext 上传 assets 需要）
#   vars.CLOUDFLARE_ACCOUNT_ID     —— 非敏感，用 vars 而非 secret，便于日志排查
#
# ★不设 paths 过滤：Worker 部署的是**整个构建产物**，任何源码/依赖/配置改动都可能影响它。
#   加 paths 白名单会出现"改了没在白名单里的文件 → 不部署 → 线上与 main 不一致"的静默漂移，
#   与 aster-api deploy.yml 顶部记录的同类死角一致。

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # 手动补部署（如本次转仓后需要把积压的提交推上线）
  workflow_dispatch:

permissions:
  contents: read

# 同一时刻只允许一个部署在跑；不取消进行中的（部署不可中途打断，
# 半途取消可能留下 assets 已上传而 script 未切换的中间态）。
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    # ★门控：仅当显式设 vars.ENABLE_CI_WORKER_DEPLOY=true 才部署。
    #   目的是杜绝与 Cloudflare Git 集成的双路部署（见文件头说明）。
    #   未设时本 job 直接 skip——不是失败，因为"没启用"是当前的预期状态。
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && vars.ENABLE_CI_WORKER_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 发布前置核对
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id || 'workflow_dispatch' }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion || 'manual dispatch' }}
        run: |
          set -euo pipefail
          printf 'head_sha=%s\nCI run id=%s\n结论=%s\n' "$HEAD_SHA" "$CI_RUN_ID" "$CI_CONCLUSION"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/deploy-worker-started-at"

      # fail-loud 前置：缺凭据时立刻停，而不是让 wrangler 报难懂的 401/404。
      - name: Assert deploy credentials present
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [ -n "$CF_API_TOKEN" ] || { echo "::error::缺 secrets.CF_API_TOKEN（需 Workers Scripts:Edit + Workers KV:Edit）"; exit 1; }
          [ -n "$CF_ACCOUNT_ID" ] || { echo "::error::缺 vars.CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          echo "凭据就绪，account=$CF_ACCOUNT_ID"

      # 复用 package.json 的 deploy 脚本（docs-index → next build → pii-scan →
      # opennextjs build → wrangler deploy）。不在此重写构建步骤，避免与本地
      # `pnpm deploy` 行为漂移——单一真相源在 package.json。
      - name: Build + deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          NODE_ENV: production
          DEPLOY_RUN_ID: ${{ github.run_id }}
        run: pnpm run deploy

      # 部署后核实线上版本确实变了。只看 wrangler 退出码不够——曾有"命令成功但
      # 产物未切换"的形态，故显式打印部署后的 script 元数据供人工核对。
      - name: Verify deployment landed
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          out="$(npx wrangler deployments list --name aster-cloud 2>&1 | head -20 || true)"
          echo "$out"
          echo "### Worker 部署结果" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$out" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "CI run id: ${{ github.event.workflow_run.id || 'workflow_dispatch' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "head_sha: ${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          started_at="$(cat "$RUNNER_TEMP/deploy-worker-started-at")"
          latest_time="$(printf '%s\n' "$out" | sed -nE 's/.*([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.+-]+Z?).*/\1/p' | head -1)"
          [ -n "$latest_time" ] || { echo "::error::无法从 wrangler deployments list 解析最新部署时间"; exit 1; }
          started_epoch="$(date -u -d "$started_at" +%s)"
          latest_epoch="$(date -u -d "$latest_time" +%s)"
          [ "$latest_epoch" -gt "$started_epoch" ] || { echo "::error::最新 Worker 部署时间未晚于本 job 开始时间"; exit 1; }
